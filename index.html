<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorFlow | Create Better Content</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Creator<span>Flow</span></h1>
    <p>Your free content creation toolkit.</p>
  </header>

  <main>
    <section class="hero">
      <h2>Create Better Content. Grow Faster.</h2>
      <p>Get content ideas, titles, captions, scripts, and plan your next posts.</p>
    </section>

    <section class="panel">
      <h2>Content Generator</h2>
      <label for="tool">What do you want to create?</label>
      <select id="tool">
        <option value="ideas">Video ideas</option>
        <option value="titles">YouTube titles</option>
        <option value="captions">TikTok captions</option>
        <option value="scripts">Video scripts</option>
      </select>

      <label for="niche">Your content topic</label>
      <input id="niche" placeholder="Example: gaming, fitness, cooking">

      <label for="platform">Your platform</label>
      <select id="platform">
        <option>YouTube</option>
        <option>TikTok</option>
        <option>Instagram</option>
      </select>

      <button id="generate">Generate content</button>
      <div id="result" class="result" aria-live="polite">Your results will appear here.</div>
      <button id="copy" class="secondary">Copy result</button>
    </section>

    <section class="panel">
      <h2>Content Planner</h2>
      <label for="post">Content idea</label>
      <input id="post" placeholder="What are you planning to post?">

      <label for="postDate">Posting date</label>
      <input id="postDate" type="date">

      <button id="addPost">Add to planner</button>
      <div id="planner"></div>
    </section>
  </main>

  <footer>CreatorFlow · Built for creators</footer>
  <script src="script.js"></script>
</body>
</html>
